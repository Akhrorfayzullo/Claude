<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yes</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 20%, #3A2430 0%, #241521 55%, #170D16 100%);
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  #stage { position: fixed; inset: 0; }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  #textPanel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    transition: opacity 1.1s ease;
    pointer-events: none;
    padding: 1.5rem;
  }
  #textPanel.show { opacity: 1; }
  #line1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(3rem, 12vw, 5.5rem);
    color: #F6EAE0;
    letter-spacing: -0.02em;
    line-height: 1;
    min-height: 1.1em;
  }
  #line2 {
    margin-top: 0.75rem;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 300;
    font-size: clamp(1rem, 4vw, 1.4rem);
    color: #D8A378;
    min-height: 1.4em;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    background: currentColor;
    margin-left: 2px;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #replay {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: 1px solid rgba(216,163,120,0.4);
    color: #D8A378;
    font-family: Georgia, serif;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  #replay.show { opacity: 0.7; pointer-events: auto; cursor: pointer; }
  #replay:hover { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="textPanel">
    <div id="line1"></div>
    <div id="line2"></div>
  </div>
  <button id="replay">plant again</button>
</div>
<script src="love-tree.js"></script>
</body>
</html>
